name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # macos-15, not macos-14: the 14 image ships Swift 5.10 and Package.swift
    # needs tools 6.0. The macOS 14 deployment target is set in Package.swift and
    # is independent of which OS builds it.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      # The self-test creates and deletes throwaway login-Keychain items, which
      # works on the runner. CBAR_LOG_SILENT keeps it from writing phantom
      # switch decisions into a log the README tells you to trust.
      - name: Self-test
        run: swift run CbarSelfTest
        env:
          CBAR_LOG_SILENT: "1"
      - name: Release build
        run: ./build.sh
